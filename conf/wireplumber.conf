# Clamp util to keep Pipewire on ecores
context.modules = [
	{ name = libpipewire-module-rt
        args = {
            nice.level    = -11
            #rt.prio      = 88
            #rt.time.soft = -1
            #rt.time.hard = -1
            uclamp.min = 0
            uclamp.max = 128
        }
        flags = [ ifexists nofail ]
    }
]

monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "~hw:AppleJ[0-9][0-9][0-9],1" }
        ]
        actions = {
            update-props = {
                audio.allowed-rates = [96000, 88200, 48000, 44100]
                node.name = "alsa_output.platform-sound.RawSpeakers"
                node.description = "Raw Speaker Device (do not use)"
                node.nick = "RawSpeakers"
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "~hw:AppleJ[0-9][0-9][0-9]HPAI,0" }
            # T8140 (J700): the array is PCM 1 of the AOP card
            { api.alsa.path = "~hw:AppleJ[0-9][0-9][0-9]AOP,1" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.platform-sound.RawMics"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMics"
            }
        }
    }
    # J700: PCM 0 of the AOP card is the always-on low-power microphone. It
    # is for developers (see README.J700.md), never a user source, so no
    # profile of the card may turn it into a node (pro-audio nodes have a
    # numeric hw: path, so match the card id and PCM number).
    {
        matches = [
            { alsa.id = "AppleJ700AOP", alsa.device = 0 }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }
    # The built-in headphone jack of every Mac (the macaudio cards are named
    # "MacBook ...", "Mac mini ..." and "Mac Studio ..."). With nothing
    # plugged in, the jack's route is unavailable: WirePlumber would leave
    # its node at 100 % and unmuted, and not store a volume or mute set on
    # it, so both are lost at the next boot. asahi-unplugged-routes.lua
    # selects the route anyway and keeps what the user sets on it. This is
    # a device property: match the card device by name (its alsa.*
    # properties are only set once the device exists, after the rules have
    # run).
    {
        matches = [
            { device.name = "~alsa_card.*", api.alsa.card.name = "~^Mac.*" }
        ]
        actions = {
            update-props = {
                asahi.routes.select-unplugged = true
            }
        }
    }
    # J700: the headphone route starts at 10 % on the desktop's (cubic)
    # volume scale, 60 dB below jack full scale, until the user sets a
    # volume.
    {
        matches = [
            { device.name = "~alsa_card.*", api.alsa.card.name = "MacBook Neo J700" }
        ]
        actions = {
            update-props = {
                device.routes.default-sink-volume = 0.001
            }
        }
    }
    # J616s: the headphone jack is a card of its own (hw:AppleJack, macaudio
    # "MacBook Pro J616 Jack"), so UCM's priorities between the jack and the
    # speakers do not apply across the two cards. Its UCM ties the Headphones
    # and Headset devices to the jack switches: unplugged, the card has no
    # available profile. Plugged in, these make the jack the default sink and
    # source, above the J616 speaker filter (priority.session 850) and the
    # built-in microphones (2000). A default chosen by hand still wins while
    # it is available.
    {
        matches = [
            { node.name = "~alsa_output.*", api.alsa.path = "hw:AppleJack,0" }
        ]
        actions = {
            update-props = {
                priority.driver = 1100
                priority.session = 1100
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_input.*", api.alsa.path = "hw:AppleJack,0" }
        ]
        actions = {
            update-props = {
                priority.driver = 2100
                priority.session = 2100
            }
        }
    }
    {
        matches = [ { api.alsa.path = "hw:AppleJ704,1" } ]
        actions = { update-props = { audio.allowed-rates = [48000] } }
    }
]

